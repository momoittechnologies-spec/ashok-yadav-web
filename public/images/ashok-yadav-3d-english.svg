<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#FFF9C4" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="85%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    .font-3d {
      font-family: 'Impact', 'Arial Black', -apple-system, sans-serif;
      font-size: 112px;
      font-weight: 900;
      letter-spacing: 3px;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .shadow-layer {
      fill: #000000;
      stroke: #000000;
      stroke-width: 14px;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .outline-layer {
      fill: #000000;
      stroke: #000000;
      stroke-width: 14px;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .text-fill {
      fill: url(#goldGrad);
      stroke: #000000;
      stroke-width: 3px;
      stroke-linejoin: round;
    }
  </style>
  <g transform="translate(425, 90)">
    <!-- 3D Extrusion Shadow steps -->
    <text class="font-3d shadow-layer" dx="8" dy="9">ASHOK YADAV</text>
    <text class="font-3d shadow-layer" dx="6" dy="7">ASHOK YADAV</text>
    <text class="font-3d shadow-layer" dx="4" dy="5">ASHOK YADAV</text>
    <text class="font-3d shadow-layer" dx="2" dy="3">ASHOK YADAV</text>
    <!-- Base black contour outline -->
    <text class="font-3d outline-layer" dx="0" dy="0">ASHOK YADAV</text>
    <!-- Yellow gradient face -->
    <text class="font-3d text-fill" dx="0" dy="0">ASHOK YADAV</text>
  </g>
</svg>
